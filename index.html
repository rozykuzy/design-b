<style>/* ============================================================
   beodd 디자인 소싱 DB — 디자인 토큰
   ============================================================ */
:root{
  --stone-50:#F6F6F6; --stone-100:#ECECEC; --stone-200:#DCDCDC; --stone-300:#C4C4C4;
  --stone-400:#9C9C9C; --stone-500:#767676; --stone-600:#565656; --stone-700:#3C3C3C;
  --stone-800:#232323; --stone-900:#141414; --white:#FFF;
  --accent:#525251; --accent-soft:#F4F4F3; --accent-line:#CFCFCC;

  --page:var(--stone-50); --raised:var(--white); --sunken:var(--stone-100);
  --ink:var(--stone-900); --ink-2:var(--stone-600); --ink-3:var(--stone-500);
  --line:var(--stone-200); --line-soft:var(--stone-100); --rule:var(--stone-900);
  --mark:var(--stone-900);
  --hl-bg:#E4E4E1; --hl-ink:var(--stone-900);

  --font-display:"Beodd","Pretendard Variable",Pretendard,system-ui,sans-serif;
  --font-sans:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --font-mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;

  --t-2xs:11px; --t-xs:12px; --t-sm:13px; --t-base:15px; --t-md:17px; --t-lg:20px; --t-xl:24px;
  --tr-wide:.08em; --tr-wider:.18em; --tr-widest:.28em; --tr-tight:-.02em;

  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px; --s8:32px; --s10:40px;
  --s12:48px; --s16:64px;
  --r-xs:2px; --r-sm:4px; --r-md:6px; --r-pill:999px;
  --ease:cubic-bezier(.22,.61,.36,1); --fast:120ms; --base:220ms;

  --maxw:1280px;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px);
  --safe-r:env(safe-area-inset-right,0px);
  --bar-h:56px;   /* 검색 줄 */
  --chip-h:44px;  /* 카테고리 줄 */
  --sticky-h:calc(var(--bar-h) + var(--chip-h));
  --z-sticky:100; --z-sheet:500; --z-toast:900;
}
@media (prefers-color-scheme:dark){
  :root{
    --page:#111110; --raised:#191918; --sunken:#232322;
    --ink:#F2F2F0; --ink-2:#B4B4B0; --ink-3:#8C8C88;
    --line:#2E2E2C; --line-soft:#242423; --rule:#F2F2F0;
    --accent:#C9C9C5; --accent-soft:#232322; --accent-line:#3A3A38;
    --mark:#F2F2F0; --hl-bg:#3D3D3A; --hl-ink:#FFF;
  }
}
@font-face{font-family:"Beodd";src:url("beodd.otf") format("opentype");font-weight:400;font-display:swap}
@font-face{font-family:"Pretendard Variable";src:url("PretendardVariable.woff2") format("woff2-variations");
  font-weight:45 920;font-style:normal;font-display:swap}

/* ============================================================ 기본 */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%; background:var(--page); scroll-behavior:smooth}
body{
  margin:0; background:var(--page); color:var(--ink);
  font-family:var(--font-sans); font-size:var(--t-base); line-height:1.6;
  -webkit-font-smoothing:antialiased; font-feature-settings:"tnum";
  padding-left:var(--safe-l); padding-right:var(--safe-r);
  overflow-wrap:break-word;
}
body.is-locked{overflow:hidden}
*{-webkit-tap-highlight-color:transparent}
a{color:inherit; text-decoration:none}
button{font:inherit; color:inherit; background:none; border:0; cursor:pointer}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:var(--r-xs)}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto} *{animation:none!important; transition:none!important}
}
.sr{position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden;
  clip:rect(0 0 0 0); white-space:nowrap; border:0}
.wrap{max-width:var(--maxw); margin:0 auto; padding:0 var(--s5)}

/* ============================================================ 헤더 */
.top{
  position:sticky; top:0; z-index:var(--z-sticky);
  background:var(--page); padding-top:var(--safe-t);
  border-bottom:1px solid var(--line);
}
.top__bar{
  max-width:var(--maxw); margin:0 auto; height:var(--bar-h);
  display:flex; align-items:center; gap:var(--s3); padding:0 var(--s5);
}
.mark{display:flex; align-items:center; gap:var(--s2); flex:none; min-width:0}

.mark__txt{display:none}
@media (min-width:640px){
  .mark__txt{display:block; font-family:var(--font-display); font-size:var(--t-md);
    letter-spacing:.01em; line-height:1; padding-top:2px; color:var(--ink)}
}
.mark__sub{
  display:none; font-family:var(--font-mono); font-size:var(--t-2xs);
  letter-spacing:var(--tr-widest); text-transform:uppercase; color:var(--ink-3);
  white-space:nowrap;
}
@media (min-width:1024px){ .mark__sub{display:block; margin-left:var(--s3)} }

/* 검색 */
.search{position:relative; flex:1 1 auto; min-width:0; display:flex; align-items:center}
.search input{
  width:100%; height:38px; font-family:var(--font-sans); font-size:16px; /* iOS 확대 방지 */
  color:var(--ink); background:var(--sunken); border:1px solid transparent;
  border-radius:var(--r-sm); padding:0 var(--s8) 0 var(--s3); outline:none;
  transition:border-color var(--fast) var(--ease), background var(--fast) var(--ease);
}
.search input::placeholder{color:var(--ink-3)}

.search__x{

  width:34px; height:34px; display:none; align-items:center; justify-content:center;

.iconbtn{

/* 카테고리 칩 — 항상 고정 */
.chips{

  padding:0 var(--s3); border:1px solid var(--line); border-radius:var(--r-pill);
  font-size:var(--t-sm); color:var(--ink-2); white-space:nowrap; scroll-snap-align:center;
  background:var(--raised); transition:background var(--fast) var(--ease), color var(--fast) var(--ease);
}

.chip i{font-family:var(--font-mono); font-size:var(--t-2xs); font-style:normal; color:var(--ink-3)}
.chip.on{background:var(--ink); border-color:var(--ink); color:var(--page)}
.chip.on i{color:var(--page); opacity:.7}
.chip--fav.act{background:var(--accent-soft); border-color:var(--accent-line); color:var(--ink)}

/* 상태 줄 */
.status{
  max-width:var(--maxw); margin:0 auto; padding:var(--s3) var(--s5) 0;
  display:flex; align-items:baseline; gap:var(--s3); flex-wrap:wrap;

  color:var(--ink-3);
}
.status b{color:var(--ink); font-weight:600}
.status button{color:var(--ink-2); text-decoration:underline; text-underline-offset:3px; font-family:var(--font-sans); font-size:var(--t-xs)}

/* ============================================================ 레이아웃 */
.layout{max-width:var(--maxw); margin:0 auto; padding:var(--s4) var(--s5) var(--s16);
  padding-bottom:calc(var(--s16) + var(--safe-b))}
@media (min-width:1024px){
  .layout{display:grid; grid-template-columns:200px 1fr; gap:var(--s10); align-items:start;
    padding-top:var(--s8)}

  :root{--sticky-h:var(--bar-h)}
}
.side{display:none}
@media (min-width:1024px){
  .side{display:block; position:sticky; top:calc(var(--bar-h) + var(--safe-t) + var(--s6));
    max-height:calc(100vh - var(--bar-h) - 80px); overflow-y:auto}
  .side__h{font-family:var(--font-mono); font-size:var(--t-2xs); letter-spacing:var(--tr-widest);
    text-transform:uppercase; color:var(--ink-3); margin:0 0 var(--s3)}
  .side a{display:flex; justify-content:space-between; gap:var(--s2); align-items:baseline;

  .side a:hover{color:var(--ink); background:var(--sunken)}

  .side a i{font-family:var(--font-mono); font-size:var(--t-2xs); font-style:normal; color:var(--ink-3)}
}

/* ============================================================ 카테고리 */
.cat{margin-bottom:var(--s12); scroll-margin-top:calc(var(--sticky-h) + var(--safe-t) + var(--s3))}
.cat__h{
  display:flex; align-items:baseline; gap:var(--s3); flex-wrap:wrap;
  border-bottom:1.5px solid var(--rule); padding-bottom:var(--s2); margin-bottom:var(--s2);
}
.cat__n{font-family:var(--font-display); font-size:var(--t-sm); color:var(--ink-3); letter-spacing:.04em;
  flex:none; line-height:1}
.cat__t{font-size:var(--t-lg); font-weight:700; letter-spacing:var(--tr-tight); margin:0; line-height:1.15}

/* 세부분류 */

  white-space:nowrap}
.sub__r{flex:1; height:1px; background:var(--line)}
.sub__c{font-family:var(--font-mono); font-size:var(--t-2xs); color:var(--ink-3)}

/* ============================================================ 항목 */
.rows{border-top:1px solid var(--line)}
.row{
  display:grid; grid-template-columns:1fr auto; gap:2px var(--s3);
  padding:var(--s3) 0; border-bottom:1px solid var(--line-soft); align-items:start;
}
.row__main{min-width:0}
.row__n{
  display:inline-flex; align-items:baseline; gap:5px; font-size:var(--t-base); font-weight:600;
  letter-spacing:var(--tr-tight); line-height:1.35; min-height:24px;
}
.row__n .ar{font-size:10px; color:var(--ink-3); flex:none}
a.row__n:active{color:var(--accent)}

.row__s{font-size:var(--t-sm); color:var(--ink-2); line-height:1.55; margin-top:3px}

mark{background:var(--hl-bg); color:var(--hl-ink); border-radius:2px; padding:0 1px}

/* ============================================================ 맨 위로 */
.up{
  position:fixed; right:calc(var(--s5) + var(--safe-r)); bottom:calc(var(--s5) + var(--safe-b));
  width:44px; height:44px; border-radius:var(--r-pill); background:var(--ink); color:var(--page);

}
.up.on{opacity:1; transform:none; pointer-events:auto}
.up svg{width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:1.8}

.toast{

}

<script>/* ============================================================
   beodd 디자인 소싱 DB — 앱 로직
   ============================================================ */
(function () {
  "use strict";

  var DB = window.__SOURCING_DB || [];
  var TOTAL = 0, FLAT = [];
  var LS_FAV = "beodd.db.fav", LS_VIEW = "beodd.db.view";

  /* ---------- 저장소 (사파리 프라이빗 모드 대비) ---------- */
  function lsGet(k, fb) {
    try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : fb; }
    catch (e) { return fb; }
  }
  function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

  var fav = {};
  (lsGet(LS_FAV, []) || []).forEach(function (k) { fav[k] = 1; });
  var view = lsGet(LS_VIEW, {}) || {};
  var sortMode = view.sort === "name" ? "name" : "default";
  var showDesc = view.desc !== false;
  var favOnly = false;

  /* ---------- 유틸 ---------- */
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (m) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m];
    });
  }
  function slug(s) {
    return "c-" + String(s).replace(/[^\uAC00-\uD7A3a-zA-Z0-9]+/g, "-").replace(/^-|-$/g, "");
  }
  function hi(text, term) {
    var t = esc(text);
    if (!term) return t;
    var low = String(text).toLowerCase(), i = low.indexOf(term), out = "", last = 0;
    if (i < 0) return t;
    while (i > -1) {
      out += esc(String(text).slice(last, i)) + "<mark>" + esc(String(text).slice(i, i + term.length)) + "</mark>";
      last = i + term.length;
      i = low.indexOf(term, last);
    }
    return out + esc(String(text).slice(last));
  }
  function debounce(fn, ms) {
    var t; return function () { var a = arguments, c = this; clearTimeout(t); t = setTimeout(function () { fn.apply(c, a); }, ms); };
  }

  /* ---------- 인덱스 준비 ---------- */
  DB.forEach(function (c, ci) {
    c.id = slug(c.cat); c.num = ("0" + (ci + 1)).slice(-2);
    c.subs.forEach(function (s) {
      s.items.forEach(function (it) {
        it.key = it.d || (c.cat + "/" + it.n);
        it.hay = (it.n + " " + it.s + " " + it.l + " " + it.d + " " + s.sub + " " + c.cat).toLowerCase();
        it._c = c; it._s = s;
        FLAT.push(it); TOTAL++;
      });
    });
  });

  /* ---------- DOM ---------- */
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var main = $("#main"), chips = $("#chips"), side = $("#side"),
      q = $("#q"), clearBtn = $("#clear"), status = $("#status"),
      upBtn = $("#up"), sheet = $("#sheet"), scrim = $("#scrim"),
      viewBtn = $("#viewbtn"), toast = $("#toast");

  var curTerm = "", cacheFull = null, toastTimer;

  function say(msg) {
    toast.textContent = msg; toast.classList.add("on");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toast.classList.remove("on"); }, 1600);
  }

  /* ---------- 렌더 ---------- */
  var STAR = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.6l2.6 5.3 5.8.8-4.2 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8L3.6 9.7l5.8-.8z" stroke-linejoin="round"/></svg>';
  var FIND = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.4"/><path d="M15.8 15.8L21 21" stroke-linecap="round"/></svg>';

  function rowHtml(it, term) {
    var on = fav[it.key] ? " on" : "";
    var name = hi(it.n, term);
    var nameCell = it.d
      ? '<a class="row__n" href="https://' + esc(it.d) + '" target="_blank" rel="noopener noreferrer" data-d="' + esc(it.d) + '">' + name + '<span class="ar">↗</span></a>'
      : '<span class="row__n">' + name + "</span>";
    return '<div class="row' + (it.d ? "" : " row--nolink") + '">' +
      '<div class="row__main">' + nameCell +
        (it.l ? '<div class="row__l">' + hi(it.l, term) + "</div>" : "") +
        (it.s ? '<div class="row__s">' + hi(it.s, term) + "</div>" : "") +
      "</div>" +
      '<div class="acts">' +
      '<button class="find" data-q="' + esc(it.n) + '" aria-label="' + esc(it.n) + ' 웹에서 검색">' + FIND + "</button>" +
      '<button class="star' + on + '" data-k="' + esc(it.key) + '" aria-pressed="' + (on ? "true" : "false") +
        '" aria-label="' + esc(it.n) + ' 즐겨찾기">' + STAR + "</button>" +
      "</div></div>";
  }

  function sortItems(arr) {
    if (sortMode !== "name") return arr;
    return arr.slice().sort(function (a, b) {
      return a.n.localeCompare(b.n, "ko", { sensitivity: "base" });
    });
  }

  function build(term) {
    var html = "", shown = 0;
    for (var i = 0; i < DB.length; i++) {
      var c = DB[i], subsHtml = "", catCount = 0;
      for (var j = 0; j < c.subs.length; j++) {
        var s = c.subs[j], items = s.items;
        if (term) items = items.filter(function (it) { return it.hay.indexOf(term) > -1; });
        if (favOnly) items = items.filter(function (it) { return fav[it.key]; });
        if (!items.length) continue;
        items = sortItems(items);
        catCount += items.length;
        var rows = "";
        for (var k = 0; k < items.length; k++) rows += rowHtml(items[k], term);
        subsHtml += '<section class="sub"><div class="sub__h"><h3 class="sub__t">' + esc(s.sub) +
          '</h3><span class="sub__r"></span><span class="sub__c">' + items.length +
          '</span></div><div class="rows">' + rows + "</div></section>";
      }
      if (!catCount) continue;
      shown += catCount;
      html += '<section class="cat" id="' + c.id + '" data-cat="' + esc(c.cat) + '">' +
        '<div class="cat__h"><span class="cat__n">' + c.num + '</span>' +
        '<h2 class="cat__t">' + esc(c.cat) + '</h2>' +
        '<span class="cat__c">' + catCount + '</span>' +
        '<span class="cat__u">' + esc(c.use || "") + "</span></div>" + subsHtml + "</section>";
    }
    return { html: html, shown: shown };
  }

  function emptyHtml() {
    if (favOnly) {
      return '<div class="empty"><b>즐겨찾기가 비어 있습니다</b>' +
        "<span>목록에서 별 아이콘을 눌러<br>자주 쓰는 곳을 모아두세요.</span>" +
        '<button data-act="allcat">전체 보기</button></div>';
    }
    return '<div class="empty"><b>검색 결과가 없습니다</b>' +
      "<span>브랜드명·작가명·지역·설명을 검색할 수 있습니다.<br>철자를 바꾸거나 더 짧게 입력해 보세요.</span>" +
      '<button data-act="clear">검색어 지우기</button></div>';
  }

  function render() {
    var term = curTerm;
    var r;
    if (!term && !favOnly && sortMode === "default" && cacheFull) {
      main.innerHTML = cacheFull.html;
      r = cacheFull;
    } else {
      r = build(term);
      if (!term && !favOnly && sortMode === "default") cacheFull = r;
      main.innerHTML = r.html || emptyHtml();
    }
    main.classList.toggle("hide-desc", !showDesc);

    var favN = Object.keys(fav).length;
    status.innerHTML = term || favOnly
      ? "<b>" + r.shown + "</b> / " + TOTAL + "곳" + (term ? ' <span>“' + esc(term) + "”</span>" : "")
      : "<b>" + TOTAL + "</b>곳 · " + DB.length + " 카테고리" + (favN ? " · ★ " + favN : "");
    clearBtn.classList.toggle("on", !!q.value);
    syncChips(r);
    updateSpy();
  }

  /* ---------- 칩·사이드 네비 ---------- */
  function buildNav() {
    var favN = Object.keys(fav).length;
    var html = '<button class="chip chip--fav' + (favOnly ? " on act" : "") + '" data-fav="1">' +
      "<b>★ 즐겨찾기</b><i>" + favN + "</i></button>";
    html += DB.map(function (c) {
      return '<a class="chip" href="#' + c.id + '" data-jump="' + c.id + '"><b>' + esc(c.cat) + "</b><i>" + c.count + "</i></a>";
    }).join("");
    chips.innerHTML = html;
    side.innerHTML = '<p class="side__h">Category</p>' + DB.map(function (c) {
      return '<a href="#' + c.id + '" data-jump="' + c.id + '"><span>' + esc(c.cat) + "</span><i>" + c.count + "</i></a>";
    }).join("");
  }
  function syncChips(r) {
    var favN = Object.keys(fav).length;
    var f = chips.querySelector(".chip--fav");
    if (f) { f.querySelector("i").textContent = favN; f.classList.toggle("on", favOnly); }
    // 검색 중 결과 없는 카테고리는 흐리게
    chips.querySelectorAll("[data-jump]").forEach(function (a) {
      var vis = !!document.getElementById(a.dataset.jump);
      a.style.opacity = vis ? "" : ".3";
      a.style.pointerEvents = vis ? "" : "none";
    });
    side.querySelectorAll("[data-jump]").forEach(function (a) {
      var vis = !!document.getElementById(a.dataset.jump);
      a.style.opacity = vis ? "" : ".3";
      a.style.pointerEvents = vis ? "" : "none";
    });
  }

  /* ---------- 스크롤 스파이 ---------- */
  var spyRaf = 0;
  function updateSpy() {
    cancelAnimationFrame(spyRaf);
    spyRaf = requestAnimationFrame(function () {
      var head = parseInt(getComputedStyle(document.documentElement).getPropertyValue("--sticky-h")) || 100;
      var secs = main.querySelectorAll(".cat"), cur = null;
      for (var i = 0; i < secs.length; i++) {
        if (secs[i].getBoundingClientRect().top - head - 20 <= 0) cur = secs[i];
      }
      if (!cur && secs.length) cur = secs[0];
      var id = cur ? cur.id : null;
      chips.querySelectorAll("[data-jump]").forEach(function (a) {
        var on = a.dataset.jump === id;
        if (on && !a.classList.contains("on") && !favOnly) {
          a.scrollIntoView({ block: "nearest", inline: "center", behavior: "smooth" });
        }
        a.classList.toggle("on", on && !favOnly);
      });
      side.querySelectorAll("[data-jump]").forEach(function (a) {
        a.classList.toggle("on", a.dataset.jump === id);
      });
      upBtn.classList.toggle("on", window.scrollY > 500);
    });
  }

  /* ---------- 검색 ---------- */
  var doSearch = debounce(function () {
    curTerm = q.value.trim().toLowerCase();
    if (curTerm && favOnly) { favOnly = false; }
    render();
    window.scrollTo({ top: 0, behavior: "auto" });
    var u = new URL(location.href);
    if (curTerm) u.searchParams.set("q", q.value.trim()); else u.searchParams.delete("q");
    history.replaceState(null, "", u.pathname + u.search + u.hash);
  }, 140);

  q.addEventListener("input", doSearch);
  q.addEventListener("keydown", function (e) {
    if (e.key === "Escape") { q.value = ""; doSearch(); q.blur(); }
    if (e.key === "Enter") q.blur();
  });
  clearBtn.addEventListener("click", function () { q.value = ""; doSearch(); q.focus(); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "/" && document.activeElement !== q && !sheet.classList.contains("on")) {
      e.preventDefault(); q.focus(); q.select();
    }
  });

  /* ---------- 클릭 위임 ---------- */
  document.addEventListener("click", function (e) {
    var star = e.target.closest(".star");
    if (star) {
      e.preventDefault();
      var k = star.dataset.k;
      if (fav[k]) { delete fav[k]; star.classList.remove("on"); star.setAttribute("aria-pressed", "false"); say("즐겨찾기 해제"); }
      else { fav[k] = 1; star.classList.add("on"); star.setAttribute("aria-pressed", "true"); say("즐겨찾기 추가"); }
      lsSet(LS_FAV, Object.keys(fav));
      cacheFull = null;
      var favN = Object.keys(fav).length;
      var f = chips.querySelector(".chip--fav i"); if (f) f.textContent = favN;
      if (favOnly) render();
      else if (!curTerm) status.innerHTML = "<b>" + TOTAL + "</b>곳 · " + DB.length + " 카테고리" + (favN ? " · ★ " + favN : "");
      return;
    }
    var find = e.target.closest("[data-q]");
    if (find) {
      e.preventDefault();
      var name = find.dataset.q;
      var ko = /[\uAC00-\uD7A3]/.test(name);
      var url = ko
        ? "https://search.naver.com/search.naver?query=" + encodeURIComponent(name)
        : "https://www.google.com/search?q=" + encodeURIComponent(name + " design");
      window.open(url, "_blank", "noopener");
      return;
    }
    var favBtn = e.target.closest("[data-fav]");
    if (favBtn) {
      e.preventDefault();
      if (!Object.keys(fav).length) { say("먼저 별을 눌러 추가하세요"); return; }
      favOnly = !favOnly;
      if (favOnly) { q.value = ""; curTerm = ""; clearBtn.classList.remove("on"); }
      render(); window.scrollTo({ top: 0 });
      return;
    }
    var jump = e.target.closest("[data-jump]");
    if (jump) {
      e.preventDefault();
      var el = document.getElementById(jump.dataset.jump);
      if (el) {
        var head = parseInt(getComputedStyle(document.documentElement).getPropertyValue("--sticky-h")) || 100;
        var safe = parseInt(getComputedStyle(document.documentElement).getPropertyValue("--safe-t")) || 0;
        window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - head - safe - 12, behavior: "smooth" });
        history.replaceState(null, "", "#" + jump.dataset.jump);
      }
      return;
    }
    var act = e.target.closest("[data-act]");
    if (act) {
      if (act.dataset.act === "clear") { q.value = ""; doSearch(); }
      if (act.dataset.act === "allcat") { favOnly = false; render(); }
      return;
    }
  });

  upBtn.addEventListener("click", function () { window.scrollTo({ top: 0, behavior: "smooth" }); q.blur(); });
  window.addEventListener("scroll", updateSpy, { passive: true });
  window.addEventListener("resize", updateSpy, { passive: true });

  /* ---------- 보기 시트 ---------- */
  function openSheet(on) {
    sheet.classList.toggle("on", on);
    scrim.classList.toggle("on", on);
    document.body.classList.toggle("is-locked", on && window.innerWidth < 1024);
    viewBtn.classList.toggle("on", on);
    viewBtn.setAttribute("aria-expanded", on ? "true" : "false");
  }
  viewBtn.addEventListener("click", function () { openSheet(!sheet.classList.contains("on")); });
  scrim.addEventListener("click", function () { openSheet(false); });
  $("#sheetclose").addEventListener("click", function () { openSheet(false); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") openSheet(false); });

  function paintSheet() {
    $("#sortD").classList.toggle("on", sortMode === "default");
    $("#sortN").classList.toggle("on", sortMode === "name");
    $("#tgDesc").classList.toggle("on", showDesc);
    $("#tgDesc").setAttribute("aria-checked", showDesc ? "true" : "false");
    $("#favN").textContent = Object.keys(fav).length + "곳";
  }
  $("#sortD").addEventListener("click", function () { sortMode = "default"; view.sort = "default"; lsSet(LS_VIEW, view); paintSheet(); cacheFull = null; render(); });
  $("#sortN").addEventListener("click", function () { sortMode = "name"; view.sort = "name"; lsSet(LS_VIEW, view); paintSheet(); render(); });
  $("#tgDesc").addEventListener("click", function () {
    showDesc = !showDesc; view.desc = showDesc; lsSet(LS_VIEW, view); paintSheet();
    main.classList.toggle("hide-desc", !showDesc);
  });
  $("#favClear").addEventListener("click", function () {
    if (!Object.keys(fav).length) return;
    fav = {}; lsSet(LS_FAV, []); cacheFull = null; favOnly = false;
    paintSheet(); render(); say("즐겨찾기를 비웠습니다");
  });

  /* ---------- 시작 ---------- */
  buildNav();
  var params = new URLSearchParams(location.search);
  if (params.get("q")) { q.value = params.get("q"); curTerm = q.value.trim().toLowerCase(); }
  render();
  paintSheet();

  if (location.hash) {
    var t = document.getElementById(location.hash.slice(1));
    if (t) setTimeout(function () {
      var head = parseInt(getComputedStyle(document.documentElement).getPropertyValue("--sticky-h")) || 100;
      window.scrollTo({ top: t.getBoundingClientRect().top + window.scrollY - head - 12 });
    }, 60);
  }
  document.documentElement.setAttribute("data-ready", "1");
  window.__DB_READY = true;
})();
</script>
<div class="empty" id="bootfail" style="display:none">
  <b>화면을 불러오지 못했습니다</b>
  <span>페이지를 새로고침해 주세요.<br>계속 같은 화면이면 담당자에게 알려주세요.</span>
</div>
<script>
setTimeout(function () {
  if (!window.__DB_READY) document.getElementById('bootfail').style.display = 'block';
}, 5000);
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function (e) { console.warn('sw', e); });
  });
}
</script>
</body>
</html>
